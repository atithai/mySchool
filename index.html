<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Sheet CRUD Demo</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>ระบบข้อมูลจาก Google Sheets</h1>
      <p>Frontend: GitHub Pages · Data/Images: Google Drive</p>
    </header>

    <section class="card">
      <h2>เพิ่ม / แก้ไขข้อมูล</h2>
      <form id="studentForm">
        <input type="hidden" id="row">
        <label>ID <input id="id" required></label>
        <label>ชื่อ <input id="name" required></label>
        <label>อายุ <input id="age" type="number" min="1" max="120" required></label>
        <label>URL รูปภาพใน Google Drive
          <input id="imageUrl" placeholder="https://drive.google.com/...">
        </label>
        <div class="actions">
          <button type="submit">บันทึก</button>
          <button type="button" id="cancelBtn" class="secondary">ยกเลิก</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>รายการข้อมูล</h2>
        <button id="reloadBtn">โหลดข้อมูล</button>
      </div>
      <p id="status"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>รูป</th><th>ID</th><th>ชื่อ</th><th>อายุ</th><th>จัดการ</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
